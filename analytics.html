<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DWELL · Villa Espinette — Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0a0a0a;
      --s1:     #111111;
      --s2:     #161616;
      --border: #1f1f1f;
      --text:   #f0ede8;
      --muted:  #55534f;
      --sub:    #888580;
      --gold:   #c9a96e;
      --green:  #6bab8a;
      --red:    #b06060;
      --serif:  'Instrument Serif', Georgia, serif;
      --mono:   'DM Mono', monospace;
      --sans:   'DM Sans', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
    }

    .h-left { display: flex; align-items: baseline; gap: 10px; }

    .h-brand {
      font-family: var(--serif);
      font-size: 17px;
      letter-spacing: 0.05em;
    }

    .h-sep { color: var(--muted); font-size: 11px; }

    .h-prop {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sub);
    }

    .h-right { display: flex; align-items: center; gap: 16px; }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--green);
      text-transform: uppercase;
    }

    .live-pill::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    .h-updated {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    .btn-refresh {
      background: none;
      border: 1px solid var(--border);
      color: var(--sub);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: border-color .2s, color .2s;
    }
    .btn-refresh:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Main ───────────────────────── */
    main { padding: 28px; display: flex; flex-direction: column; gap: 20px; }

    .label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Metric strip ───────────────── */
    .metrics-strip {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
    }

    .metric {
      padding: 24px 24px 20px;
      border-right: 1px solid var(--border);
    }
    .metric:last-child { border-right: none; }

    .metric-val {
      font-family: var(--mono);
      font-size: 40px;
      font-weight: 300;
      line-height: 1;
      margin-bottom: 6px;
    }
    .metric-val.gold  { color: var(--gold); }
    .metric-val.green { color: var(--green); }
    .metric-val.muted { color: var(--sub); }

    .metric-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .metric-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Device bars ────────────────── */
    .device-card {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
    }

    .device-bars { display: flex; flex-direction: column; gap: 10px; margin-top: 0; }

    .bar-row { display: flex; align-items: center; gap: 12px; }

    .bar-name {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--sub);
      width: 64px;
      flex-shrink: 0;
      letter-spacing: 0.06em;
    }

    .bar-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--sub);
      width: 28px;
      flex-shrink: 0;
      text-align: right;
    }

    .bar-track {
      flex: 1;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 1px;
      background: var(--gold);
      transition: width .7s ease;
    }
    .bar-fill.mobile  { background: var(--sub); }
    .bar-fill.tablet  { background: var(--muted); }

    .bar-pct {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Activity ───────────────────── */
    .activity-card {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .ac-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .ac-title {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .ac-total {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 9px 20px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-weight: 400;
    }

    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--s2); }

    tbody td {
      padding: 9px 20px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--sub);
    }

    .td-time { color: var(--muted); font-size: 10px; white-space: nowrap; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .badge-view { background: rgba(255,255,255,.04); color: var(--muted); }
    .badge-cta  { background: rgba(201,169,110,.12); color: var(--gold); }
    .badge-dev  { background: rgba(255,255,255,.04); color: var(--sub); }

    /* ── States ─────────────────────── */
    .state {
      padding: 36px 20px;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .error-bar {
      padding: 14px 20px;
      background: rgba(176,96,96,.08);
      border: 1px solid rgba(176,96,96,.2);
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--red);
    }
  </style>
</head>
<body>

  <header>
    <div class="h-left">
      <span class="h-brand">DWELL<sup style="font-size:10px;vertical-align:super">®</sup></span>
      <span class="h-sep">·</span>
      <span class="h-prop">Villa Espinette</span>
    </div>
    <div class="h-right">
      <span class="live-pill">Live</span>
      <span class="h-updated" id="updated">—</span>
      <button class="btn-refresh" onclick="load()">↺ Refresh</button>
    </div>
  </header>

  <main>

    <div id="error" class="error-bar" style="display:none"></div>

    <!-- Metrics -->
    <div>
      <div class="label">Overview</div>
      <div class="metrics-strip" id="metrics">
        <div class="metric"><div class="metric-val muted">—</div><div class="metric-label">Visits</div></div>
        <div class="metric"><div class="metric-val muted">—</div><div class="metric-label">Enquiries</div></div>
        <div class="metric"><div class="metric-val muted">—</div><div class="metric-label">Conversion</div></div>
        <div class="metric"><div class="metric-val muted">—</div><div class="metric-label">Unique Days</div></div>
      </div>
    </div>

    <!-- Devices -->
    <div>
      <div class="label">Device Breakdown — Visits</div>
      <div class="device-card">
        <div class="device-bars" id="devices">
          <div class="state">Loading…</div>
        </div>
      </div>
    </div>

    <!-- Activity -->
    <div>
      <div class="activity-card">
        <div class="ac-header">
          <span class="ac-title">Recent Activity</span>
          <span class="ac-total" id="total-count">—</span>
        </div>
        <div id="activity"><div class="state">Loading…</div></div>
      </div>
    </div>

  </main>

  <script>
  const SB   = 'https://kdzkffcqmutwojyauqtj.supabase.co';
  const KEY  = 'sb_publishable_XtBrgzqzM2GBOa-RNVH8uA_qfrPEaTd';
  const PAGE = 'villa-espinette';
  const CTA  = ['nav_cta_click','demander_visite'];

  const hdrs = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY };

  async function load() {
    document.getElementById('error').style.display = 'none';
    try {
      const r = await fetch(
        `${SB}/rest/v1/events?select=*&page_id=eq.${PAGE}&order=created_at.desc&limit=500`,
        { headers: hdrs }
      );
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const ev = await r.json();
      render(ev);
      document.getElementById('updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-GB');
    } catch(e) {
      document.getElementById('error').textContent = '⚠ ' + e.message + ' — Run the SQL setup in Supabase first.';
      document.getElementById('error').style.display = 'block';
    }
  }

  function render(ev) {
    const views   = ev.filter(e => e.event_type === 'page_view');
    const ctas    = ev.filter(e => CTA.includes(e.event_type));
    const conv    = views.length ? (ctas.length / views.length * 100).toFixed(1) + '%' : '—';
    const days    = new Set(ev.map(e => e.created_at.slice(0,10))).size;

    // Metrics
    document.getElementById('metrics').innerHTML = `
      <div class="metric">
        <div class="metric-val">${views.length}</div>
        <div class="metric-label">Visits</div>
      </div>
      <div class="metric">
        <div class="metric-val gold">${ctas.length}</div>
        <div class="metric-label">Enquiries</div>
        <div class="metric-sub">nav + contact CTA</div>
      </div>
      <div class="metric">
        <div class="metric-val green">${conv}</div>
        <div class="metric-label">Conversion</div>
        <div class="metric-sub">enquiries / visits</div>
      </div>
      <div class="metric">
        <div class="metric-val muted">${days || '—'}</div>
        <div class="metric-label">Active Days</div>
      </div>`;

    // Devices (from page views only)
    const dc = { desktop: 0, mobile: 0, tablet: 0 };
    views.forEach(e => { dc[e.device || 'desktop'] = (dc[e.device || 'desktop'] || 0) + 1; });
    const tot = views.length || 1;
    const pct = n => tot ? Math.round(n/tot*100) : 0;

    document.getElementById('devices').innerHTML = [
      ['Desktop', 'desktop', dc.desktop],
      ['Mobile',  'mobile',  dc.mobile],
      ['Tablet',  'tablet',  dc.tablet],
    ].map(([name, cls, n]) => `
      <div class="bar-row">
        <span class="bar-name">${name}</span>
        <span class="bar-count">${n}</span>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct(n)}%"></div></div>
        <span class="bar-pct">${tot > 1 ? pct(n) + '%' : '—'}</span>
      </div>`).join('');

    // Activity
    document.getElementById('total-count').textContent = ev.length + ' events total';

    if (!ev.length) {
      document.getElementById('activity').innerHTML =
        '<div class="state">No events yet — open the page to start tracking.</div>';
      return;
    }

    const rows = ev.slice(0, 50).map(e => {
      const isCta = CTA.includes(e.event_type);
      const d = new Date(e.created_at);
      const time = d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})
                 + ' · ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      const label = e.event_type.replace(/_/g,' ');
      return `<tr>
        <td class="td-time">${time}</td>
        <td><span class="badge ${isCta ? 'badge-cta' : 'badge-view'}">${label}</span></td>
        <td><span class="badge badge-dev">${e.device || '—'}</span></td>
        <td class="td-time" style="font-size:9px">${e.referrer === 'direct' ? '—' : (e.referrer||'').slice(0,35)}</td>
      </tr>`;
    }).join('');

    document.getElementById('activity').innerHTML = `
      <table>
        <thead><tr>
          <th>Time</th><th>Event</th><th>Device</th><th>Referrer</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  load();
  setInterval(load, 30000);
  </script>

</body>
</html>
